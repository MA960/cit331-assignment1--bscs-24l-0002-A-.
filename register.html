<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Qarshi University Startup Club for Ambitious and absurd minds.">
  <title>Startup Club</title>
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <header id="top">
    <img src="logo.svg" alt="" width="40" height="40">
    <span>Startup Club</span>
    <nav>
        <ul>
         <li><a href="index.html">Home</a></li>
         <li><a href="events.html">Events</a></li>
         <li><a href="Register.html" class="active" aria-current="page">Register</a></li>
        </ul>
    </nav>
  </header>

    <figure class="logo-figure">
      <img src="startup_home.jpg" alt="People Around a table discussing" width="400" height="200">
      <figcaption>Meet like minded people and persue goals otherwise considered ambitious.</figcaption>
    </figure>

  <main>
    <form>
        <label for="name">Full name *</label>
          <input type="text" id="name" name="name" required minlength="3"
                 maxlength="50" placeholder="e.g. Mubeen Amir" autocomplete="name">
        <br>
        <label for="phone">Mobile number *</label>
          <input type="tel" id="phone" name="phone" required pattern="03[0-9]{9}"
                 title="11 digits starting with 03, for example 03001234567"
                 placeholder="0321000000" autocomplete="tel">
                 <br>


        <label for="email">Enter your email:</label>
        <input type="email" id="email" name="email" placeholder="24l-0002@qu.edu.pk">


        
        <br>
         <label for="item">Events *</label>
          <select id="item" name="item" required>
            <option value="">Choose an Event</option>
            <option>Idea generation Convention</option>
            <option>Idea Viability Conference</option>
            <option>Project Partner Finalization</option>
            <option>Project Planning</option>
            
          </select>



  



    </form>

      <section class="saved-events">
    <h2>Saved Events</h2>
    <p>These are stored in this browser only.</p>
    <div class="table-wrap">
      <table>
        <caption>Saved events</caption>
        <thead>
          <tr>
            <th scope="col">Your Name</th>
            <th scope="col">Events</th>

          </tr>
        </thead>
        <tbody id="events-body"></tbody>
      </table>
    </div>
  
  </section>






  </main>




  <footer>
    <p>&copy; 2026 Trademark Startup Club Qarshi University</p>
  </footer>

    <a class="back-to-top" href="#top" aria-label="Back to top">&uarr;</a>
</body>
</html>
